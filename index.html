<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi CRUD PBO - LocalStorage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
    nav button { padding: 8px 16px; border: none; background: #007bff; color: white; border-radius: 4px; cursor: pointer; }
    nav button:hover { background: #0056b3; }
    .page { display: none; }
    .active { display: block; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button.btn-submit { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; }
    button.btn-submit:hover { background: #218838; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    table, th, td { border: 1px solid #ddd; }
    th, td { padding: 10px; text-align: left; }
    th { background-color: #f8f9fa; }
    .btn-danger { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
    .btn-edit { background: #ffc107; color: black; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 12px; color: white; }
    .admin { background-color: #dc3545; }
    .member { background-color: #17a2b8; }
  </style>
</head>
<body>

<div class="container">
  <nav id="navbar" style="display: none;">
    <button onclick="app.showPage('page-users')">Daftar User</button>
    <button onclick="app.showPage('page-profile')">Profile</button>
    <button onclick="app.logout()" style="background: #6c757d; margin-left: auto;">Logout</button>
  </nav>

  <!-- HALAMAN 1: LOGIN -->
  <div id="page-login" class="page active">
    <h2>Login Aplikasi</h2>
    <p style="margin-bottom: 15px; color: #666;">Default Admin: <b>admin@mail.com</b> / Pass: <b>123456</b></p>
    <form id="form-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" required>
      </div>
      <button type="submit" class="btn-submit">Login</button>
    </form>
  </div>

  <!-- HALAMAN 2: DAFTAR USER (CRUD) -->
  <div id="page-users" class="page">
    <h2>Kelola Data User</h2>
    <form id="form-user" style="margin-top: 15px;">
      <input type="hidden" id="user-id">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="user-nama" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="user-email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="user-password" required>
      </div>
      <div class="form-group">
        <label>Role User</label>
        <select id="user-role">
          <option value="Member">Member</option>
          <option value="Admin">Admin</option>
        </select>
      </div>
      <button type="submit" class="btn-submit" id="btn-save">Tambah User</button>
    </form>

    <h3 style="margin-top: 25px;">Tabel Daftar User</h3>
    <table>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Email</th>
          <th>Role</th>
          <th>Aksi Khusus (Polimorfisme)</th>
          <th>Aksi CRUD</th>
        </tr>
      </thead>
      <tbody id="user-table-body"></tbody>
    </table>
  </div>

  <!-- HALAMAN 3: PROFILE -->
  <div id="page-profile" class="page">
    <h2>Profile Pengguna</h2>
    <div id="profile-content" style="margin-top: 15px; line-height: 1.8;"></div>
  </div>
</div>

<script>
  // ==========================================
  // KONSEP PBO: PEWARISAN & POLIMORFISME
  // ==========================================

  // Parent Class (Superclass)
  class User {
    constructor(id, nama, email, password, role = "User") {
      this.id = id;
      this.nama = nama;
      this.email = email;
      this.password = password;
      this.role = role;
    }

    // Method Parent yang akan di-override (Polimorfisme)
    getHakAkses() {
      return "Akses standar pengguna.";
    }

    renderBadge() {
      return `<span class="badge member">${this.role}</span>`;
    }
  }

  // Child Class 1: Admin (Mewarisi class User)
  class AdminUser extends User {
    constructor(id, nama, email, password) {
      super(id, nama, email, password, "Admin");
    }

    // Overriding Method (Polimorfisme)
    getHakAkses() {
      return "Full Access: Tambah, Edit, dan Hapus Data.";
    }

    renderBadge() {
      return `<span class="badge admin">${this.role}</span>`;
    }
  }

  // Child Class 2: Member (Mewarisi class User)
  class MemberUser extends User {
    constructor(id, nama, email, password) {
      super(id, nama, email, password, "Member");
    }

    // Overriding Method (Polimorfisme)
    getHakAkses() {
      return "Limited Access: Hanya dapat melihat data dan edit profile sendiri.";
    }
  }

  // Factory Method untuk menginstansiasi objek berbasis class
  function createUserObject(data) {
    if (data.role === "Admin") {
      return new AdminUser(data.id, data.nama, data.email, data.password);
    }
    return new MemberUser(data.id, data.nama, data.email, data.password);
  }

  // ==========================================
  // LOGIKA MANAJEMEN APLIKASI & CRUD
  // ==========================================

  class App {
    constructor() {
      this.currentUser = null;
      this.initData();
      this.bindEvents();
    }

    // Inisialisasi data di LocalStorage jika belum ada
    initData() {
      if (!localStorage.getItem('users')) {
        const initialUsers = [
          new AdminUser(1, 'Administrator', 'admin@mail.com', '123456'),
          new MemberUser(2, 'Budi Santoso', 'budi@mail.com', '123456')
        ];
        localStorage.setItem('users', JSON.stringify(initialUsers));
      }
    }

    getUsers() {
      const rawData = JSON.parse(localStorage.getItem('users')) || [];
      // Mengubah objek JSON mentah menjadi Instance Class
      return rawData.map(u => createUserObject(u));
    }

    saveUsers(users) {
      localStorage.setItem('users', JSON.stringify(users));
    }

    showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');

      if (pageId === 'page-users') this.renderTable();
      if (pageId === 'page-profile') this.renderProfile();
    }

    bindEvents() {
      // Event Login
      document.getElementById('form-login').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;

        const users = this.getUsers();
        const found = users.find(u => u.email === email && u.password === pass);

        if (found) {
          this.currentUser = found;
          document.getElementById('navbar').style.display = 'flex';
          this.showPage('page-users');
        } else {
          alert('Email atau Password salah!');
        }
      });

      // Event Submit User (Create / Update)
      document.getElementById('form-user').addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('user-id').value;
        const nama = document.getElementById('user-nama').value;
        const email = document.getElementById('user-email').value;
        const password = document.getElementById('user-password').value;
        const role = document.getElementById('user-role').value;

        let users = this.getUsers();

        if (id) {
          // Update Data
          users = users.map(u => u.id == id ? createUserObject({ id: Number(id), nama, email, password, role }) : u);
        } else {
          // Create Data Baru
          const newId = users.length ? Math.max(...users.map(u => u.id)) + 1 : 1;
          const newUser = createUserObject({ id: newId, nama, email, password, role });
          users.push(newUser);
        }

        this.saveUsers(users);
        this.resetForm();
        this.renderTable();
      });
    }

    resetForm() {
      document.getElementById('user-id').value = '';
      document.getElementById('form-user').reset();
      document.getElementById('btn-save').textContent = 'Tambah User';
    }

    renderTable() {
      const users = this.getUsers();
      const tbody = document.getElementById('user-table-body');
      tbody.innerHTML = '';

      users.forEach(user => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${user.nama}</td>
          <td>${user.email}</td>
          <td>${user.renderBadge()}</td>
          <!-- Polimorfisme: Hasil output getHakAkses() berbeda tergantung Class-nya -->
          <td><small><i>${user.getHakAkses()}</i></small></td>
          <td>
            <button class="btn-edit" onclick="app.editUser(${user.id})">Edit</button>
            <button class="btn-danger" onclick="app.deleteUser(${user.id})">Hapus</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    editUser(id) {
      const users = this.getUsers();
      const user = users.find(u => u.id === id);
      if (user) {
        document.getElementById('user-id').value = user.id;
        document.getElementById('user-nama').value = user.nama;
        document.getElementById('user-email').value = user.email;
        document.getElementById('user-password').value = user.password;
        document.getElementById('user-role').value = user.role;
        document.getElementById('btn-save').textContent = 'Update User';
      }
    }

    deleteUser(id) {
      if (confirm('Yakin ingin menghapus data ini?')) {
        let users = this.getUsers();
        users = users.filter(u => u.id !== id);
        this.saveUsers(users);
        this.renderTable();
      }
    }

    renderProfile() {
      const content = document.getElementById('profile-content');
      if (this.currentUser) {
        content.innerHTML = `
          <p><b>Nama:</b> ${this.currentUser.nama}</p>
          <p><b>Email:</b> ${this.currentUser.email}</p>
          <p><b>Role:</b> ${this.currentUser.renderBadge()}</p>
          <p><b>Otorisasi System:</b> ${this.currentUser.getHakAkses()}</p>
        `;
      }
    }

    logout() {
      this.currentUser = null;
      document.getElementById('navbar').style.display = 'none';
      document.getElementById('form-login').reset();
      this.showPage('page-login');
    }
  }

  // Inisialisasi Aplikasi
  const app = new App();
</script>

</body>
</html>
